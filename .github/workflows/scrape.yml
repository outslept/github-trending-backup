on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending-scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --ignore-scripts
      - name: build-scraper
        run: pnpm --filter github-trending-tools build
      - name: scrape-trending
        run: pnpm scrape:trending
      - name: commit-changes
        run: |
          git config user.name "outslept"
          git config user.email "135520429+outslept@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update trending repositories and metadata"
            git push
          fi
