name: trending

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --ignore-scripts
      - name: configure-git-user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: build-scraper
        run: pnpm --filter github-trending-tools build
      - name: scrape-trending
        run: pnpm --filter github-trending-tools start
        env:
          GITHUB_TRENDING_DATA_DIR: ${{ github.workspace }}/packages/github-trending-data
      - name: commit-changes
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update trending repositories and metadata"
            git push
          fi
